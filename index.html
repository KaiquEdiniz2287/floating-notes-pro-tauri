<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Floating Notes Pro - v2.0.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="quill/quill.snow.css" />
    <link rel="stylesheet" href="./assets/fontawesome-free/css/all.min.css" />
  </head>

  <body class="dark">
    <div id="app">
      <div id="topbar">
        <div id="tabs-wrapper">
          <div id="tabs"></div>
          <button id="add-tab" title="Adicionar aba">+</button>
        </div>

        <div id="actions">
          <input type="text" id="search" placeholder="Pesquisar..." />
          <button id="export-btn" title="Baixar nota">
            <i class="fa-solid fa-download"></i>
          </button>
          <button id="import-btn" title="Carregar nota">
            <i class="fa-solid fa-upload"></i>
          </button>
          <button id="replace-btn" title="Localizar e substituir">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <button id="pin-btn" class="pin-btn" title="Fixar no topo (Ctrl+Alt+P)">
            <i class="fa-solid fa-thumbtack"></i>
          </button>
          <button id="theme-btn" class="theme-toggle" title="Tema">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>

      <div id="editor"></div>

      <div id="statusbar">
        <div class="status-left">
          <span id="cursor-pos">Ln 1, Col 1</span>
        </div>
        <div class="status-right">
          <span id="char-count">0 caracteres</span>
          <span id="word-count">0 palavras</span>
        </div>
      </div>
    </div>

    <!-- POPUP DE SUBSTITUIR POR -->

    <div id="replace-popup" class="replace-popup hidden">
      <div class="replace-box">
        <div class="replace-header" id="replace-drag">
          Substituir
          <button id="close-replace">✕</button>
        </div>
        <input id="find-input" placeholder="Localizar..." />
        <input id="replace-input" placeholder="Substituir por..." />
        <label class="replace-option">
          <input type="checkbox" id="case-sensitive" />
          Diferenciar maiúsculas/minúsculas
        </label>

        <div class="replace-buttons">
          <button id="find-next">Próximo</button>
          <button id="replace-all">Substituir tudo</button>
        </div>
      </div>
    </div>

    <!-- POPUP DE BAIXAR -->

    <div id="export-popup" class="export-popup hidden">
      <div class="export-box">
        <div class="export-header">
          Exportar nota
          <button id="close-export">✕</button>
        </div>
        <button id="export-txt">Baixar como TXT</button>
        <button id="export-md">Baixar como Markdown (.md)</button>
        <button id="export-pdf">Baixar como PDF</button>
      </div>
    </div>

    <!-- COLOR POPUP -->

    <div id="color-popup" class="color-popup hidden">
      <div class="color-section">
        <button class="color-clear" data-action="clear">
          Sem preenchimento
        </button>
      </div>

      <div class="color-section-title">Padrão</div>
      <div class="color-grid" id="color-grid"></div>
      <div class="color-section-title">Recentes</div>
      <div class="recent-colors" id="recent-colors"></div>
      <button id="custom-color-btn" class="custom-color-btn">
        🎨 Cor personalizada...
      </button>

      <input type="color" id="hidden-color-picker" hidden />
    </div>

    <!-- UPDATE OVERLAY -->
    <div id="update-overlay" class="update-overlay hidden">
      <div class="update-box">
        <div id="update-icon">
          <i
            class="fa-solid fa-cloud-arrow-down"
            style="color: rgb(0, 255, 0)"
          ></i>
        </div>
        <div id="update-title">Nova versão disponível</div>
        <div id="update-subtitle">Baixando atualização...</div>
        <div class="update-progress-wrap" id="update-progress-wrap">
          <div class="update-progress-bar" id="update-progress-bar"></div>
        </div>
        <div id="update-percent">0%</div>
        <div id="update-actions" class="hidden">
          <p id="update-ready-text">
            Atualização pronta! Deseja reiniciar agora?
          </p>
          <div class="update-buttons">
            <button id="update-restart-btn">Reiniciar agora</button>
            <button id="update-later-btn">Mais tarde</button>
          </div>
        </div>
      </div>
    </div>

    <!-- CONFIRMAÇÃO DA ABA -->
    <div id="confirm-popup" class="confirm-popup hidden">
      <div class="confirm-box">
        <div class="confirm-title" id="confirm-title">Confirmação</div>
        <div class="confirm-message" id="confirm-message">
          Deseja realmente fechar?
        </div>
        <div class="confirm-actions">
          <button id="confirm-ok">Sim</button>
          <button id="confirm-cancel">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- ABRIR ARQUIVO DEPOIS DO DOWNLOAD -->
    <div id="download-toast" class="download-toast hidden">
      <div class="download-toast-icon">
        <i
          class="fa-solid fa-cloud-arrow-down"
          style="color: rgb(0, 255, 0)"
        ></i>
      </div>

      <div class="download-toast-content">
        <div class="download-toast-title">Download completo.</div>

        <button id="open-pdf-btn">Abrir arquivo</button>
      </div>
    </div>

    <input type="file" id="import-file" hidden />
    <script src="quill/quill.js"></script>
    <script src="sortable/Sortable.min.js"></script>
    <script src="html2pdf.bundle.min.js"></script>
    <script src="js/tauri-api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
